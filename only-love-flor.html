<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a50055">
<title>ONLY LOVE — Flor</title>
<style>
:root{--pink:#ff4f9a;--deep:#65002f;--cream:#fff4e7;--red:#c9184a;--gold:#ffe6a7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
body{min-height:100vh;overflow-x:hidden;color:#4b1930;background:
 radial-gradient(circle at 15% 15%,#ff7bb6 0 2px,transparent 3px),
 radial-gradient(circle at 85% 28%,#ffd2e5 0 2px,transparent 4px),
 radial-gradient(circle at 35% 78%,#ff9bc7 0 2px,transparent 4px),
 linear-gradient(145deg,#3d0025,#a50055 48%,#4b002d);background-size:130px 130px,190px 190px,170px 170px,auto}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.48;background-image:
 radial-gradient(ellipse at center,rgba(255,195,224,.65) 0 1px,transparent 2px),
 radial-gradient(ellipse at center,rgba(255,255,255,.5) 0 1px,transparent 3px);
 background-size:48px 53px,83px 91px;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.9;filter:brightness(1.6)}}
.glow{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(80px);opacity:.25;background:#ff3b91;pointer-events:none}
.glow.one{top:-90px;left:-70px}.glow.two{right:-90px;bottom:-100px;background:#ffb6d5}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.shell{width:min(980px,100%);text-align:center}
.brand{color:#ffe2ef;font-size:clamp(2.2rem,7vw,4.5rem);letter-spacing:.2em;text-shadow:0 0 8px #fff,0 0 22px #ff8cbd,0 0 42px #ff2388;margin:0 0 5px  .2em}
.tag{color:#ffd3e5;letter-spacing:.18em;font:italic 14px Arial,sans-serif;margin-bottom:22px}
.card{position:relative;overflow:hidden;min-height:470px;border-radius:26px;background:linear-gradient(135deg,#fff8ee,#f8e7d5);box-shadow:0 22px 70px #21001488,inset 0 0 0 1px #fff;display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;padding:34px 38px}
.card:before,.card:after{content:"♡";position:absolute;color:#edb4c7;font-size:28px;opacity:.5}.card:before{top:16px;left:20px}.card:after{bottom:14px;right:22px}
.copy{text-align:left;position:relative;z-index:2;padding:10px 12px}
.kicker{font:12px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#b34c70}
h2{font-size:clamp(1.9rem,4vw,3rem);line-height:1.12;color:#8e163f;font-weight:normal;margin:14px 0}
.name{font-style:italic;color:#c2185b;text-shadow:0 0 12px #ffb2ce}
.message{font:16px/1.7 Arial,sans-serif;color:#744456;max-width:330px}
.signature{margin-top:24px;color:#b14a70;font-style:italic}
.scene{height:390px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.ground{position:absolute;bottom:26px;width:88%;height:2px;background:linear-gradient(90deg,transparent,#d5a4a8,transparent)}
.tree{position:absolute;bottom:28px;width:100%;height:350px;opacity:0;transform:scale(.15);transform-origin:50% 100%;transition:transform 2.8s cubic-bezier(.18,.78,.25,1),opacity .8s}
.tree.grown{opacity:1;transform:scale(1)}
.trunk{position:absolute;bottom:0;left:50%;width:15px;height:130px;transform:translateX(-50%);background:linear-gradient(90deg,#6d351e,#a96b3e,#633018);border-radius:50% 50% 4px 4px;box-shadow:3px 0 4px #6b321c}
.branch{position:absolute;bottom:85px;left:50%;width:8px;height:105px;background:#85502f;border-radius:8px;transform-origin:bottom}
.branch.l{transform:rotate(-38deg)}.branch.r{transform:rotate(38deg)}
.crown{position:absolute;left:50%;top:0;width:min(330px,88%);height:270px;transform:translateX(-50%)}
.leaf{position:absolute;line-height:1;filter:drop-shadow(0 1px 2px #8f0c35);animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(9deg) translateY(-3px)}}
.spark{position:absolute;color:#e8a33a;text-shadow:0 0 8px #ffcc62;animation:blink 1.8s infinite alternate}
@keyframes blink{to{opacity:.2;transform:scale(.55)}}
.start{position:absolute;z-index:5;left:50%;top:46%;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;color:#c2185b;display:flex;flex-direction:column;align-items:center;gap:8px}
.start .heart{font-size:58px;line-height:1;filter:drop-shadow(0 0 9px #ff75aa);animation:pulse 1.1s infinite}
.start span:last-child{font:12px Arial,sans-serif;color:#9e3159;background:#fff8f0cc;padding:7px 12px;border-radius:20px}
@keyframes pulse{50%{transform:scale(1.18);filter:drop-shadow(0 0 18px #ff2b83)}}
.start.hidden{display:none}
.footer{color:#ffd9e9;font:12px Arial,sans-serif;letter-spacing:.16em;margin-top:18px}
.replay{display:none;margin:18px auto 0;background:#ffe5ef;color:#8e1643;border:1px solid #ffbad3;border-radius:25px;padding:11px 20px;font:13px Arial,sans-serif;cursor:pointer}
.replay.show{display:block}
@media(max-width:650px){.wrap{padding:22px 12px}.brand{letter-spacing:.14em}.card{grid-template-columns:1fr;padding:28px 22px 18px;min-height:680px}.copy{text-align:center;padding:5px}.message{margin:auto}.scene{height:340px}.tree{height:320px}.crown{height:245px}.footer{line-height:1.7}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow one"></div><div class="glow two"></div>
<main class="wrap"><div class="shell">
  <h1 class="brand">ONLY LOVE</h1>
  <div class="tag">un pequeño mundo hecho de amor ✨</div>
  <section class="card">
    <div class="copy">
      <div class="kicker">Para alguien especial</div>
      <h2>Flor,<br><span class="name">eres mi lugar favorito</span></h2>
      <p class="message">Hay personas que iluminan nuestros días sin siquiera intentarlo. Tú haces que los momentos sencillos se conviertan en recuerdos hermosos.</p>
      <div class="signature">Con todo mi cariño ❤️</div>
    </div>
    <div class="scene" aria-label="Árbol de corazones">
      <div class="ground"></div>
      <div class="tree" id="tree"><div class="trunk"></div><div class="branch l"></div><div class="branch r"></div><div class="crown" id="crown"></div></div>
      <button class="start" id="start" aria-label="Hacer crecer el árbol de corazones"><span class="heart">♥</span><span>Toca el corazón</span></button>
    </div>
  </section>
  <button class="replay" id="replay">Volver a ver la magia ✨</button>
  <div class="footer">HECHO CON AMOR · ONLY LOVE</div>
</div></main>
<script>
const crown=document.getElementById('crown'),tree=document.getElementById('tree');
const start=document.getElementById('start'),replay=document.getElementById('replay');
let seed=17;function rand(){seed=(seed*9301+49297)%233280;return seed/233280}
function makeTree(){
  crown.innerHTML='';
  // Corazones distribuidos dentro de una silueta de copa redondeada en forma de corazón.
  for(let i=0;i<155;i++){
    const x=rand()*100,y=rand()*100;
    const nx=(x-50)/50, ny=(y-48)/52;
    const heartShape=Math.pow(nx*nx+ny*ny-0.72,3)-nx*nx*Math.pow(ny,3);
    if(heartShape>0.055) continue;
    const el=document.createElement('span');el.className='leaf';el.textContent='♥';
    el.style.left=x+'%';el.style.top=y+'%';
    el.style.fontSize=(10+rand()*13)+'px';
    el.style.color=['#b5093d','#d41450','#ed315f','#f05a78','#a90037'][Math.floor(rand()*5)];
    el.style.animationDelay=(rand()*2)+'s';crown.appendChild(el);
  }
  for(let i=0;i<18;i++){
    const s=document.createElement('span');s.className='spark';s.textContent='✦';
    s.style.left=(8+rand()*84)+'%';s.style.top=(5+rand()*88)+'%';s.style.fontSize=(9+rand()*9)+'px';s.style.animationDelay=(rand()*2)+'s';crown.appendChild(s);
  }
}
function grow(){makeTree();start.classList.add('hidden');tree.classList.add('grown');replay.classList.add('show')}
start.addEventListener('click',grow);
replay.addEventListener('click',()=>{tree.classList.remove('grown');replay.classList.remove('show');start.classList.remove('hidden');});
</script>
</body>
</html>
